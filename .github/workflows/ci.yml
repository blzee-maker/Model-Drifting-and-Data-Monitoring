name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest

      - name: Verify the stable scenario reports no drift
        run: python src/main.py --current data/stable_data.csv

      - name: Verify the drift scenario recommends retraining
        shell: bash
        run: |
          set +e
          python src/main.py --current data/new_data.csv
          [ $? -eq 1 ] || { echo "expected exit code 1 (retrain)"; exit 1; }
